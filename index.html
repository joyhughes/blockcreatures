<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Creatures</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='6' width='8' height='6' fill='%23e8b04a'/%3E%3Crect x='9' y='3' width='6' height='4' fill='%234fa3d9'/%3E%3C/svg%3E">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<style>
  :root {
    --bg: #14171c; --panel: #1b1f26; --line: #2c323c; --text: #d9dde4; --muted: #8b93a1;
    --accent: #e8b04a; --accent2: #4fa3d9;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: grid; grid-template-columns: 1fr 340px; height: 100vh; overflow: hidden; }
  #stage { position: relative; min-width: 0; }
  #view { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 14px; top: 12px; pointer-events: none; text-shadow: 0 1px 3px #000a; }
  #hud .title { font-size: 15px; font-weight: 600; }
  #hud .sub { color: #e6e9ee; opacity: .85; font-variant-numeric: tabular-nums; }
  #replaybar { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 6px; align-items: center; }
  #replaybar .lbl { display: flex; gap: 5px; align-items: center; background: #232831; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
  #record.rec { border-color: #d9534f; color: #fff; background: #4a1f1f; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 24px; }
  h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .02em; }
  .lede { color: var(--muted); margin: 0 0 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  .tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tasks button { text-align: left; padding: 7px 9px; }
  .tasks button.on, .seg button.on { border-color: var(--accent); color: #fff; background: #2a2618; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button, select, input { font: inherit; color: var(--text); background: #232831; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover { border-color: #46505e; }
  button.primary { background: var(--accent); color: #1b1608; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  input[type=number] { width: 72px; }
  [hidden] { display: none !important; }
  .teamB { display: block; font-size: 11px; font-weight: 400; color: #c9b6f2; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .stat { background: #20252d; border-radius: 6px; padding: 6px 8px; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; }
  #chart { width: 100%; height: 130px; display: block; background: #171a20; border-radius: 6px; }
  .legend { color: var(--muted); font-size: 11px; margin-top: 4px; display: flex; gap: 12px; }
  .legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 4px; }
  #gens { max-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  #gens div { display: flex; justify-content: space-between; padding: 3px 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
  #gens div:hover { background: #262b34; }
  #gens div.on { background: #2a2618; color: #fff; }
  #graph { width: 100%; height: 200px; display: block; background: #171a20; border-radius: 6px; }
  .note { color: var(--muted); font-size: 12px; }
  #islandList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  #islandList div { background: #20252d; border-radius: 6px; padding: 4px 7px; cursor: pointer; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
  #islandList div:hover { border-color: #46505e; }
  #islandList div.top { border-color: var(--accent); }
  #islandGen { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }
  #islandList i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  #islandList span { color: var(--muted); font-size: 11px; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"><div class="title" id="hudTitle"></div><div class="sub" id="hudSub"></div></div>
  <div id="replaybar">
    <button id="restart" title="Restart replay">⟲ Restart</button>
    <button id="record" title="Record the replay from the start as a video; click again to stop early">● Record</button>
    <select id="show" title="Which creatures to show">
      <option value="best" selected>Best</option>
      <option value="ever" title="The highest-scoring generation best of the whole run">Best so far</option>
      <option value="rival" id="showRival" hidden title="Two teams: team B's best, against team A's best of the previous generation">Team B best</option>
      <option value="islands">Island bests</option>
      <option value="top">Top 25</option>
      <option value="all">Whole population</option>
    </select>
    <label class="lbl" title="Labels over creatures shown side by side"><input type="checkbox" id="labels" checked> Labels</label>
    <select id="speed" title="Playback speed">
      <option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
  </div>
</div>
<aside>
  <h1>Block Creatures</h1>
  <p class="lede">Evolving virtual creatures after Karl Sims (1994): morphology and neural control evolved together as directed graphs.</p>

  <h2>Evolutionary target</h2>
  <div class="tasks" id="tasks"></div>

  <h2>Body plan</h2>
  <div class="seg" id="plan">
    <button data-plan="free" class="on" title="Sims' original: any shape, per-connection reflection">Free</button>
    <button data-plan="bilateral" title="Mirror-symmetric about a midplane">Bilateral</button>
    <button data-plan="radial" title="N-fold rotational symmetry about a vertical axis">Radial</button>
    <button data-plan="snake" title="Animal template: head, body chain, tail">Snake</button>
    <button data-plan="quadruped" title="Animal template: four two-joint legs with five-toed paws; head (optional neck, trunk); optional tail; optional fin or fluke on the tail and trunk tips; optional dorsal fin">Quadruped</button>
    <button data-plan="insect" title="Animal template: six legs with knees; head (optional antennae, mandibles); abdomen (optional stinger)">Insect</button>
    <button data-plan="arachnid" title="Animal template: eight legs with knees (optional front pincers); head (optional mandibles); optional tail with stinger">Arachnid</button>
    <button data-plan="crustacean" title="Animal template: ten legs with knees, pincers on the front pair; head with antennae; optional tail">Crustacean</button>
    <button data-plan="centipede" title="Animal template: head (optional pincers) and repeating segments with two kneed legs each">Centipede</button>
    <button data-plan="biped" title="Animal template: upright torso on two legs; optional head, arms, tail">Biped</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label id="nWrap" hidden>Arms <select id="radialN"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option></select></label>
    <label title="Genes may choose capsules and spheres as well as boxes; chains of capsules become tentacles"><input type="checkbox" id="round"> Round parts</label>
    <label title="Only creatures with an appendage at least this many segments long are viable: jellyfish and octopus arms">Min arm <select id="minArm"><option value="0">any</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option></select></label>
  </div>
  <p class="note" id="planNote"></p>

  <h2>Evolution</h2>
  <div class="row">
    <label>Population <input type="number" id="pop" value="300" min="20" max="2000" step="10"></label>
    <label>Seed <input type="number" id="seed" value="1" min="1"></label>
    <label title="Sub-populations that select and mate separately; each island's best migrates to the next every 10 generations. 1 = Sims' single population">Islands <select id="islands"><option>1</option><option>2</option><option>4</option><option selected>6</option><option>8</option><option>12</option></select></label>
    <label data-kind="compete cooperate volley wrestle" title="One population: every creature plays with or against the population's own best of the previous generation. Two teams: two species that never interbreed, each paired with the other team's best of the previous generation (in competition, Sims' interspecies competition), so they keep adapting to each other. The orange creature is the one being shown; team B's best is under Show">Teams <select id="teams"><option value="1">one population</option><option value="2">two teams</option></select></label>
    <label id="teamBWrap" hidden title="Team B's body plan: the same as team A's (above), or another one, so different animals evolve against or with each other (snake v insect). Radial uses the Arms count above; Round parts and Min arm apply to both teams">Team B <select id="planB"><option value="">same plan</option><option value="free">Free</option><option value="bilateral">Bilateral</option><option value="radial">Radial</option><option value="snake">Snake</option><option value="quadruped">Quadruped</option><option value="insect">Insect</option><option value="arachnid">Arachnid</option><option value="crustacean">Crustacean</option><option value="centipede">Centipede</option><option value="biped">Biped</option></select></label>
  </div>
  <div class="row" style="margin-top:8px">
    <label title="How much selection rewards bodies unlike the rest of the population (all islands) and past novel bodies. Each island's two fittest always survive. 0 = fitness only">Novelty <select id="novelty"><option value="0">0</option><option value="0.15">0.15</option><option value="0.3" selected>0.3</option><option value="0.5">0.5</option><option value="0.7">0.7</option></select></label>
    <label title="Share of mutants given one structural change: a new limb, a duplicated segment, a chain, a moved attachment, a new joint or shape, a resized part">New structures <select id="structural"><option value="0">off</option><option value="0.1">10%</option><option value="0.25" selected>25%</option><option value="0.5">50%</option></select></label>
    <label title="Generations between migrations of each island's best to the next island. Frequent migration makes islands alike">Migrate <select id="migrate"><option value="10">every 10</option><option value="30" selected>every 30</option><option value="100">every 100</option><option value="0">never</option></select></label>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="primary" id="go">Evolve</button>
    <button id="reset">New run</button>
    <button id="champ" title="Replay a creature evolved earlier for this target and body plan">Champion</button>
  </div>
  <div class="row" style="margin-top:8px">
    <select id="examples" title="Replay an example creature"><option value="">Examples…</option></select>
    <button id="seedFrom" title="New run seeded with mutants of the creature on screen">Evolve from this</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="sGen">–</b><span>generation</span></div>
    <div class="stat"><b id="sBest">–</b><span id="sUnit">best</span></div>
    <div class="stat"><b id="sRate">–</b><span>evals / s</span></div>
  </div>

  <h2>Fitness</h2>
  <canvas id="chart"></canvas>
  <div class="legend"><span><i style="background:var(--accent)"></i>best</span><span><i style="background:var(--accent2)"></i>mean</span></div>

  <div id="islandBox" hidden>
    <h2>Islands <span id="islandGen" class="sub"></span></h2>
    <div id="islandList"></div>
    <div class="row" style="margin-top:8px">
      <button id="mate" title="Cross every island's best with every other island's best; show the hybrids and add the best to the islands">Mate island bests</button>
    </div>
    <p class="note" id="mateNote"></p>
  </div>

  <h2>Scene</h2>
  <div class="row" id="scene">
    <label title="Seconds each creature is scored for, after settling. Blank = this target's default">Lifespan <input type="number" id="scDuration" min="2" max="60" step="1"> s</label>
    <label data-env="land surface" title="Gravity on land and at the water surface, m/s². Earth 9.81, Moon 1.62, Mars 3.71">Gravity <input type="number" id="scGravity" min="0.5" max="30" step="0.1"></label>
    <label data-env="land" title="Friction between bodies and the ground (and the ball). Low = icy">Friction <input type="number" id="scFriction" min="0" max="3" step="0.1"></label>
    <label data-env="land" title="Before scoring, on land. Sims: relax with no friction and no muscles until the centre of mass stops dropping, so toppling can't carry a body forward. Timed: a fixed settle time with friction (this project's earlier behaviour)">Settle <select id="scSettle"><option value="stable">Sims: relax until still</option><option value="timed">timed, with friction</option></select></label>
    <label data-env="water surface" title="Water viscosity: how hard the water pushes back on a moving part">Viscosity <input type="number" id="scDrag" min="0.2" max="20" step="0.2"></label>
    <label data-env="surface" title="Water's density relative to the creatures'. 1.5: a creature floats about two thirds under; near 1 it barely floats; below 1 it sinks">Buoyancy <input type="number" id="scBuoyancy" min="0.5" max="5" step="0.1"></label>
    <label data-kind="follow" title="How far away the light starts">Light distance <input type="number" id="scLightDist" min="1" max="30" step="0.5"> m</label>
  </div>
  <div class="row" data-kind="cooperate" style="margin-top:8px">
    <label title="How far the goal's centre is from the ball's start, straight ahead of the two creatures">Goal distance <input type="number" id="scGoalDist" min="0.5" max="30" step="0.5"> m</label>
    <label title="The goal's radius: the ball is in when its centre is inside the circle">Goal size <input type="number" id="scGoalSize" min="0.1" max="5" step="0.1"> m</label>
    <label title="Share of the score for teamwork: the share of the game both creatures spend touching the ball at once. The rest of the score is shrunk to make room, so a goal still beats no goal. 0 = off">Together bonus <input type="number" id="scTogether" min="0" max="1" step="0.05"></label>
  </div>
  <div class="row" data-kind="compete cooperate volley lift" style="margin-top:8px">
    <label title="What the two creatures compete for: a ball rolls, so it can be pushed and dribbled; the cube of Sims' paper slides; barbell (for lifting): a bar between two plates, off the ground so a part can get under it">Prize <select id="scBall"><option value="sphere">ball</option><option value="cube">cube</option><option value="barbell">barbell</option></select></label>
    <label title="Ball radius, or half the cube's side">Size <input type="number" id="scBallSize" min="0.05" max="1" step="0.05"> m</label>
    <label title="Mass of the ball or cube">Mass <input type="number" id="scBallMass" min="0.01" max="5" step="0.01"> kg</label>
  </div>
  <div class="row" data-kind="compete cooperate volley wrestle" style="margin-top:8px">
    <label title="Distance from the prize's centre to the start zone, at ground level">Start distance <input type="number" id="scGap" min="0.5" max="20" step="0.5"> m</label>
    <label title="Sims' start zone: after relaxing, each contestant is moved up to a plane rising from the ground at the start distance, so taller bodies start further back and toppling can't reach the prize. Body length: the longest dimension is added to the start distance. None: near side at the start distance">Start zone <select id="scZone"><option value="plane">Sims' slope</option><option value="length">+ body length</option><option value="none">none</option></select></label>
    <label title="The start zone plane's angle above the ground. 45°: a point at height h starts h further back. 90°: height doesn't matter">Slope <input type="number" id="scSlope" min="10" max="90" step="5">°</label>
  </div>
  <div class="row" data-kind="compete cooperate volley wrestle" style="margin-top:8px">
    <label title="Contestants bigger than this are scaled down to it; with Same size, smaller ones are scaled up to it too">Volume <input type="number" id="scMaxVolume" min="0.1" max="3" step="0.1"> m³</label>
    <label title="Every contestant is scaled to exactly this volume, up or down, so no one wins by being small or big. Off: the volume is only a cap"><input type="checkbox" id="scSameSize"> Same size</label>
    <label title="With Sims' settling: each creature relaxes on its own, far from the ball and the other creature and with its brain idle, then moves into its start zone. Off: it relaxes against its start zone beside them, already sensing"><input type="checkbox" id="scApart"> Settle apart</label>
    <label title="Play every bout twice, swapping which creature the physics solves first, and average. The solver's fixed order can decide a mirror match outright, and evolution learned to exploit always being first. Takes twice as long. Replays show the first side"><input type="checkbox" id="scBothSides"> Both sides</label>
    <label data-kind="compete" title="Sims' control bonus: touching the prize on the side away from your own centre of mass (wrapping around it) takes up to its radius off your distance"><input type="checkbox" id="scGrip"> Wrap bonus</label>
    <label data-kind="compete" title="How the final distance to the prize is measured. Centre of mass (Sims): from each contestant's centre of mass to the prize's centre, so getting your whole body to it wins, not just touching it. Nearest part: from the contestant's closest surface, so any touch counts as distance 0">Distance from <select id="scMetric"><option value="surface">nearest part</option><option value="com">centre of mass</option></select></label>
  </div>
  <div class="row" data-kind="wrestle" style="margin-top:8px">
    <label title="Radius of the sumo ring around the middle: the further a wrestler's centre of mass gets outside it, the worse it scores">Ring radius <input type="number" id="scRing" min="0.5" max="10" step="0.25"> m</label>
    <label title="Bonus both wrestlers get for the share of the bout they spend in contact, so they come to grips instead of standing apart. 0 = off">Contact bonus <input type="number" id="scEngage" min="0" max="2" step="0.1"></label>
  </div>
  <div class="row" data-kind="climb" style="margin-top:8px">
    <label title="Height of each step">Step height <input type="number" id="scStepHeight" min="0.02" max="1" step="0.01"> m</label>
    <label title="Depth of each step's tread">Step depth <input type="number" id="scStepDepth" min="0.1" max="3" step="0.05"> m</label>
    <label title="Number of steps up from the pit">Steps <input type="number" id="scSteps" min="1" max="40" step="1"></label>
  </div>
  <div class="row" style="margin-top:8px"><button id="scReset" title="Restore the default scene">Default scene</button></div>
  <p class="note" id="sceneNote"></p>

  <h2>Best of each generation</h2>
  <div id="gens"></div>
  <div class="row" style="margin-top:8px">
    <label><input type="checkbox" id="follow" checked> Watch latest</label>
  </div>

  <h2>Genotype</h2>
  <svg id="graph"></svg>
  <p class="note" id="graphNote"></p>

  <h2>Save</h2>
  <div class="row">
    <button id="save">Save run</button>
    <label class="note" style="cursor:pointer"><input type="file" id="load" accept=".json" hidden><span style="text-decoration:underline">Load run…</span></label>
    <select id="runs" title="Open a run from the runs/ folder: the command-line runs (tools/evolve.mjs) included, newest first. A run still evolving opens as of its latest generation; pick it again to catch up"><option value="">Runs…</option></select>
  </div>
  <p class="note" id="runNote"></p>
</aside>
<script type="module" src="src/main.js"></script>
</body>
</html>
